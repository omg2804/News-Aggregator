<!DOCTYPE html>
<html>
  <head>
    <title>News Aggregator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

      body {
        padding: 25px;
        background-color: #f6f6f6;
        font-size: 20px;
      }

      .dark-mode {
        background-color: #121212 !important;
        color: #fff;
      }

      .dark-mode .card {
        background-color: #1e1e1e !important;
        border: none;
      }

      .dark-mode .card-title a {
        color: #cbe3ff !important;
      }

      .jumbotron {
        background-color: #3d3d3d;
        padding: 35px 0;
        border-radius: 12px;
        margin-bottom: 25px;
      }

      .card {
        transition: 0.2s ease-in-out;
      }

      .card:hover {
        transform: scale(1.03);
      }

      .card-img-top {
        border-radius: 12px 12px 0 0;
        height: 240px;
        object-fit: cover;
      }

      .card-footer {
        background: transparent;
        border-top: 0;
      }

      a {
        text-decoration: none;
        color: #0051b4;
      }

      a:hover {
        color: #003b80;
      }

    </style>
  </head>

  <body>

    {% load social_share %}

    <div class="container">

      <div class="jumbotron text-center">
        <h1 class="display-3 text-white">News Aggregator</h1>

        <div class="my-3">
          <div class="dropdown d-inline">
            <button class="btn btn-outline-light dropdown-toggle px-4 py-2" data-bs-toggle="dropdown">
              Load News
            </button>
            <div class="dropdown-menu">
              <a class="dropdown-item" href="{% url 'home' %}">Home Feed</a>
              <a class="dropdown-item" href="{% url 'scrape' name='latest' %}">Latest</a>
              <a class="dropdown-item" href="{% url 'scrape' name='entertainment' %}">Entertainment</a>
              <a class="dropdown-item" href="{% url 'scrape' name='sports' %}">Sports</a>
              <a class="dropdown-item" href="{% url 'scrape' name='politics' %}">Politics</a>
              <a class="dropdown-item" href="{% url 'scrape' name='opinion' %}">Opinion</a>
              <a class="dropdown-item" href="{% url 'scrape' name='breaking-news' %}">Breaking News</a>
            </div>
          </div>

          <button class="btn btn-warning ms-3 px-4" onclick="toggleMode()">
            Dark / Light
          </button>
        </div>

      </div>

      <div class="row mt-2">

        {% for object in object_list %}
        <div class="col-12 col-md-4 col-lg-3">

          <div class="card mb-4 shadow-sm border-0 rounded-4">

            {% if object.image %}
              <img src="{{ object.image }}" class="card-img-top">
            {% else %}
              <img src="https://placehold.co/400x240?text=No+Image" class="card-img-top">
            {% endif %}

            <div class="card-body text-center">
              <h5 class="card-title">
                <a href="{{ object.url }}">{{ object.title|truncatechars:60 }}</a>
              </h5>
            </div>

            <div class="card-footer text-center">

              <button class="btn btn-outline-secondary btn-sm" onclick="copyToClipboard('{{ object.url }}')">Copy</button>

              <button class="btn btn-outline-danger btn-sm">Report</button>

            </div>

          </div>

        </div>
        {% endfor %}
      </div>

    </div>

    <script>
      function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert("Copied to clipboard!");
      }

      function toggleMode() {
        document.body.classList.toggle("dark-mode");
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
